<!DOCTYPE html>

    <title>Calculatrice TP5</title>

</head>
<body>
    <h1>Calculatrice TP5</h1>
    
    <input type="number" id="nombre1" placeholder="Saisir nombre 1">
    <input type="number" id="nombre2" placeholder="Saisir nombre 2">
    <br><br>
    
    <!-- Boutons dyal l'addition w soustraction (Dyalk) -->

</body>
